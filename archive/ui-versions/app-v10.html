<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><title>单词忍者</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}iframe{display:block}</style></head>
<body><iframe id="app" src="app-v8.html" title="单词忍者"></iframe>
<script>
const frame=document.getElementById('app');
function stateOf(win){try{return JSON.parse(win.localStorage.getItem('ninja8')||win.localStorage.getItem('ninja7')||win.localStorage.getItem('ninja6')||'{}')}catch(_){return {}}}
function addReviewReminder(win){const doc=win.document,learn=doc.getElementById('learn');if(!learn||doc.getElementById('ebbinghausReminder'))return;const box=doc.createElement('div');box.id='ebbinghausReminder';box.style.cssText='margin:24px 2px 0;padding:14px;border-radius:16px;background:#fff4d8;color:#735b20;font-size:13px;line-height:1.65';box.innerHTML='<b style="font-size:16px">艾宾浩斯复习提醒</b><br>✨ 系统会在第 1、2、4、7、15、30 天安排复盘。今天复习旧词，记忆会更牢固。';const card=learn.querySelector('.wordcard');(card&&card.parentElement?card.parentElement:learn).appendChild(box)}
function drawCurve(win){const doc=win.document,grid=doc.getElementById('grid'),state=stateOf(win);if(!grid)return;let wrap=doc.getElementById('memoryCurve');if(!wrap){wrap=doc.createElement('div');wrap.id='memoryCurve';wrap.style.cssText='margin-top:18px;padding-top:14px;border-top:1px solid #e8e4da';grid.parentElement.appendChild(wrap)}const dates=[],now=new Date();for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);dates.push(d)}const values=dates.map(d=>{const k=d.toLocaleDateString('sv-SE');return(state.history&&state.history[k]&&state.history[k].words)||0}),max=Math.max(5,...values),W=340,H=220,L=34,R=10,T=24,B=34,pw=W-L-R,ph=H-T-B,points=values.map((v,i)=>`${L+i*pw/6},${T+ph-v/max*ph}`).join(' '),lines=[0,1,2,3].map(i=>{const y=T+i*ph/3,v=Math.round(max*(1-i/3));return`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e6e8e7"/><text x="2" y="${y+4}" fill="#71808d" font-size="10">${v}</text>`}).join(''),labels=dates.map((d,i)=>`<text x="${L+i*pw/6}" y="${H-9}" text-anchor="middle" fill="#71808d" font-size="10">${d.getMonth()+1}/${d.getDate()}</text>`).join(''),dots=values.map((v,i)=>`<circle cx="${L+i*pw/6}" cy="${T+ph-v/max*ph}" r="4" fill="#ff865b"/>`).join('');wrap.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="color:#17324d">记忆曲线</b><span style="font-size:11px;color:#71808d">X轴：日期 · Y轴：记忆单词量</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:220px;display:block" role="img" aria-label="最近七天记忆单词量曲线图">${lines}<polyline points="${points}" fill="none" stroke="#3e9b76" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`}
frame.addEventListener('load',()=>{const win=frame.contentWindow;addReviewReminder(win);const original=win.show;win.show=function(id){const result=original.apply(this,arguments);if(id==='calendar')setTimeout(()=>drawCurve(win),30);return result};const nav=win.document.querySelector('[data-v="calendar"]');if(nav)nav.addEventListener('click',()=>setTimeout(()=>drawCurve(win),80));if(win.document.getElementById('calendar')?.classList.contains('active'))drawCurve(win)})
</script></body></html>
