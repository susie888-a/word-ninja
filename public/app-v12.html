<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>单词忍者</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="app" src="app-v11.html" title="单词忍者"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{const win=frame.contentWindow;win.toast=function(message){const el=win.document.getElementById('toast');if(!el)return;el.textContent=message;el.style.display='block';win.clearTimeout(win.__toastTimer);win.__toastTimer=win.setTimeout(()=>el.style.display='none',1800)}});</script></body></html>
