<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>单词忍者</title><style>
:root{--n:#17324d;--g:#348664;--o:#e87554;--bg:#f7f5ef;--p:#fffdf8;--m:#71808d;--l:#e8e4da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202c36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:580px;margin:auto;padding:18px 18px 88px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.top b{display:block;font-size:21px;color:var(--n)}.pill{background:#fff0e8;color:#bd593c;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:750}.hero{margin:17px 0;background:var(--n);color:#fff;border-radius:25px;padding:22px}.hero h1{font-size:25px;margin:7px 0}.hero p{color:#d2e0e7;font-size:13px;margin:0;line-height:1.55}.bar{height:7px;border-radius:8px;background:#ffffff2b;margin-top:15px}.bar i{display:block;height:100%;border-radius:inherit;background:var(--o)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.metrics div{background:#ffffff19;border-radius:13px;padding:9px}.metrics b,.metrics span{display:block}.metrics b{font-size:16px}.metrics span{font-size:10px;color:#d2e0e7;margin-top:2px}.section{font-size:18px;margin:22px 0 10px}.levels,.modes,.actions,.answers{display:grid;gap:9px}.levels{grid-template-columns:repeat(3,1fr)}.modes,.actions,.answers{grid-template-columns:1fr 1fr}.levels button,.modes button,.answer{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:11px 7px;color:var(--m);font-size:12px;font-weight:750}.levels button.active,.modes button.active{border:2px solid var(--o);padding:10px 6px;color:var(--n)}.card{background:var(--p);border:1px solid var(--l);box-shadow:0 10px 28px #17324d0b;border-radius:20px;padding:20px}.wordcard{text-align:center}.word{font:52px Georgia,serif;color:var(--n);margin:18px 0 3px;overflow-wrap:anywhere}.phone{min-height:20px;color:var(--m);font-size:14px}.listen{border:0;border-radius:11px;padding:8px 12px;background:#edf3f7;color:var(--n);font-weight:750;margin-top:9px}.example,.meaning,.note{margin-top:16px;border-radius:14px;padding:13px 14px;text-align:left;line-height:1.6;font-size:14px}.example{background:#f1f8f4;color:#426151;font:italic 14px/1.6 Georgia,serif}.example label,.meaning label{display:block;color:var(--g);font:800 10px -apple-system;margin-bottom:3px}.meaning{background:#f7f6f0}.note{background:#fff3d9;color:#735b20}.btn{border:0;border-radius:14px;padding:14px;font-weight:800}.good{background:var(--g);color:#fff}.bad{background:#fff0e8;color:#bf583a}.view{display:none}.view.active{display:block}.prompt{min-height:90px;padding:18px 4px 5px;text-align:center;font-size:20px;line-height:1.45;color:var(--n)}.prompt small{font-size:13px;color:var(--m)}.answer{min-height:53px;color:#263a49}.answer.correct{background:#e5f4eb;border-color:var(--g)}.answer.wrong{background:#fff0e8;border-color:var(--o)}.spell{width:100%;border:1px solid var(--l);border-radius:13px;padding:14px;font:20px Georgia,serif;letter-spacing:.08em;text-align:center;margin-top:8px}.result{height:24px;margin-top:12px;text-align:center;font-size:13px;font-weight:750}.bottom{position:fixed;z-index:3;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:42px;padding:11px 18px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--l);background:#f7f5eff0}.nav{border:0;background:none;color:var(--m);font-size:12px}.nav span{display:block;font-size:20px}.nav.active{color:var(--n);font-weight:800}.toast{display:none;position:fixed;z-index:4;bottom:80px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px}
</style></head><body><main class="app"><header class="top"><div><small style="color:var(--m)">你好，</small><b id="hello">忍者</b></div><span id="levelName" class="pill">基础</span></header>
<section id="learn" class="view active"><div class="hero"><small>ADAPTIVE REVIEW</small><h1>今天也悄悄变强</h1><p>到期、容易遗忘和答错更多的词会优先出现。</p><div class="bar"><i id="bar"></i></div><div class="metrics"><div><b id="done">0 / 20</b><span>今日完成</span></div><div><b id="rate">0%</b><span>今日正确率</span></div><div><b id="dueCount">0</b><span>待复习</span></div></div></div><h2 class="section">词汇之路</h2><div class="levels"><button data-l="basic" onclick="setLevel('basic')">🌱 基础</button><button data-l="exam" onclick="setLevel('exam')">🎯 考试</button><button data-l="pro" onclick="setLevel('pro')">🥷 高阶</button></div><div class="row"><h2 class="section">智能复习</h2><span id="source" class="pill">新词</span></div><div class="card wordcard"><div id="word" class="word"></div><div id="phone" class="phone"></div><button class="listen" onclick="speak(cur[0])">🔊 听发音</button><div class="example"><label>例句</label><span id="example"></span></div><div class="actions"><button class="btn bad" onclick="answer(false)">不记得</button><button class="btn good" onclick="detail()">记得</button></div></div><div class="note"><b>排队原因</b><br><span id="why"></span></div></section>
<section id="detailView" class="view"><div class="row"><button class="listen" onclick="show('learn')">← 返回</button><span class="pill">释义与用法</span></div><div class="card" style="margin-top:14px"><div id="dword" class="word" style="text-align:center"></div><div id="dphone" class="phone" style="text-align:center"></div><div class="meaning"><label>中文释义</label><span id="meaning"></span></div><div class="example"><label>例句</label><span id="dexample"></span></div><div class="actions"><button class="btn bad" onclick="answer(false)">还不熟</button><button class="btn good" onclick="answer(true)">掌握，下一词</button></div></div></section>
<section id="quiz" class="view"><div class="hero"><small>QUIZ DOJO</small><h1>小测验道场</h1><p>换一种提取方式，才能真正记住并用对单词。</p></div><div class="modes"><button data-mode="cn" onclick="startQuiz('cn')">中译英选择</button><button data-mode="audio" onclick="startQuiz('audio')">听音选词</button><button data-mode="spell" onclick="startQuiz('spell')">拼写填空</button><button data-mode="example" onclick="startQuiz('example')">例句猜词</button></div><div class="card" style="margin-top:17px"><div class="row"><span id="qtitle" class="pill">中译英选择</span><button id="replay" class="listen" onclick="speak(qword[0])" style="display:none">🔊 再听</button></div><div id="prompt" class="prompt"></div><div id="quizBody"></div><div id="result" class="result"></div></div><div class="note">答对会延长间隔；答错会在 10 分钟后重新出现。</div></section>
</main><nav class="bottom"><button class="nav active" data-v="learn" onclick="show('learn')"><span>🥷</span>背词</button><button class="nav" data-v="quiz" onclick="show('quiz')"><span>⚡</span>测验</button></nav><div id="toast" class="toast"></div><script src="vocabulary-import.js"></script><script src="vocabulary-extra.js"></script><script>
const DB=window.WORD_NINJA_IMPORTED,DAY=864e5,L={basic:'基础',exam:'考试',pro:'高阶'},today=()=>new Date().toLocaleDateString('sv-SE'),now=()=>Date.now();function old(){let x=JSON.parse(localStorage.getItem('ninja11')||'null');if(!x)return null;let c={};Object.entries(x.counts||{}).forEach(([w,n])=>c[w]={ok:n,bad:0,streak:n,interval:Math.max(1,n*2),due:0});return{name:x.name||'忍者',daily:x.daily||20,level:x.level||'basic',day:today(),done:x.dayDone||0,right:x.dayCorrect||0,cards:c,seen:{}}}let s=JSON.parse(localStorage.getItem('wordNinja17')||'null')||old()||{name:'忍者',daily:20,level:'basic',day:today(),done:0,right:0,cards:{},seen:{}},cur,qword,qmode='cn',locked=false;function save(){localStorage.setItem('wordNinja17',JSON.stringify(s))}function resetDay(){if(s.day!==today()){s.day=today();s.done=0;s.right=0;s.seen={};save()}}function words(){return DB[s.level]||[]}function mem(w){return s.cards[w]||{ok:0,bad:0,streak:0,interval:0,due:0}}function hard(c){let n=c.ok+c.bad;return 1+(n?c.bad/n:.45)*1.8+Math.max(0,2-c.streak)*.18}function due(){return words().filter(w=>{let c=mem(w[0]);return c.due&&c.due<=now()})}function score(w){let c=mem(w[0]);return 100+hard(c)*20+Math.min(30,Math.max(0,now()-c.due)/DAY)*7+c.bad*3-c.streak*.6}function pick(){let d=due();if(d.length)return{w:d.sort((a,b)=>score(b)-score(a))[0],type:'复习'};let n=words().filter(w=>!s.cards[w[0]]&&!s.seen[w[0]]);if(n.length)return{w:n[Math.floor(Math.random()*n.length)],type:'新词'};let p=words().filter(w=>!s.seen[w[0]]);if(!p.length){s.seen={};p=words()}return{w:p.sort((a,b)=>score(b)-score(a))[0],type:'巩固'}}function mean(w){return(Array.isArray(w[7])&&w[7][0])||String(w[3]||'暂无释义').replace(/^[^。；;]*?[a-z]+\.?\s*/i,'').slice(0,70)}function escape(v){return String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function draw(){resetDay();let x=pick();cur=x.w;word.textContent=cur[0];phone.textContent=cur[1]||'';example.textContent=cur[5]||'先尝试回想词义，再查看答案。';source.textContent=x.type;let c=mem(cur[0]);why.textContent=x.type==='复习'?`该词已到复习时间，过去答错 ${c.bad} 次。`:'这是待学习的新词，掌握后会自动进入间隔复习。';stats()}function stats(){hello.textContent=s.name;levelName.textContent=L[s.level];done.textContent=`${s.done} / ${s.daily}`;rate.textContent=s.done?Math.round(s.right/s.done*100)+'%':'0%';dueCount.textContent=due().length;bar.style.width=Math.min(100,s.done/s.daily*100)+'%';document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('active',b.dataset.l===s.level))}function setLevel(l){s.level=l;s.seen={};save();draw()}function show(v){resetDay();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='learn')draw();if(v==='quiz'&&!qword)startQuiz(qmode);stats();scrollTo(0,0)}function detail(){dword.textContent=cur[0];dphone.textContent=cur[1]||'';meaning.textContent=(Array.isArray(cur[7])&&cur[7].length?cur[7]:[mean(cur)]).slice(0,3).join('； ');dexample.textContent=cur[5]||cur[2]||'';show('detailView')}function schedule(w,ok){let c={...mem(w)},old=c.interval||0;if(ok){c.ok++;c.streak++;c.interval=c.streak===1?1:c.streak===2?3:Math.min(120,Math.round(Math.max(3,old)*Math.max(1.7,2.55-hard(c)*.28)));c.due=now()+c.interval*DAY}else{c.bad++;c.streak=0;c.interval=0;c.due=now()+600000}s.cards[w]=c;return c}function note(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.t);window.t=setTimeout(()=>toast.style.display='none',1900)}function answer(ok){let c=schedule(cur[0],ok);s.seen[cur[0]]=true;s.done++;if(ok)s.right++;save();note(ok?`记忆巩固：${c.interval} 天后复习`:'已缩短间隔：10 分钟后再练');show('learn')}function speak(w){if(!('speechSynthesis'in window))return note('当前浏览器不支持语音朗读');let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}function mix(a){return a.sort(()=>Math.random()-.5)}function options(w){let p=words().filter(x=>x[0]!==w[0]),a=[];while(a.length<3&&p.length)a.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);return mix([w,...a])}function buttons(a){return`<div class="answers">${a.map(w=>`<button class="answer" data-w="${escape(w[0])}" onclick="choose(this,this.dataset.w)">${escape(w[0])}</button>`).join('')}</div>`}function startQuiz(m){qmode=m;locked=false;qword=pick().w;let t={cn:'中译英选择',audio:'听音选词',spell:'拼写填空',example:'例句猜词'};qtitle.textContent=t[m];document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));replay.style.display=m==='audio'?'inline-block':'none';result.textContent='';let p='',b='';if(m==='cn'){p=`<small>请选择对应的英文</small><br>${escape(mean(qword))}`;b=buttons(options(qword))}if(m==='audio'){p='<small>听发音，选择你听到的单词</small>';b=buttons(options(qword));setTimeout(()=>speak(qword[0]),150)}if(m==='example'){p=`<small>根据例句猜词</small><br>“${escape(qword[5]||qword[2]||'Try to recall the word.')}”`;b=buttons(options(qword))}if(m==='spell'){let w=qword[0],h=w.split('').map((x,i)=>i===0||i===w.length-1?x:'＿').join(' ');p=`<small>根据中文释义拼写单词</small><br>${escape(mean(qword))}<div style="margin-top:10px;font:24px Georgia">${h}</div>`;b='<input id="spell" class="spell" autocapitalize="none" placeholder="输入英文单词"><button class="btn good" style="width:100%;margin-top:10px" onclick="spellCheck()">提交答案</button>'}prompt.innerHTML=p;quizBody.innerHTML=b}function choose(el,w){if(!locked)finish(w.toLowerCase()===qword[0].toLowerCase(),el)}function spellCheck(){if(locked)return;let e=document.getElementById('spell');finish((e.value||'').trim().toLowerCase()===qword[0].toLowerCase(),e)}function finish(ok,el){locked=true;let c=schedule(qword[0],ok);save();el.classList.add(ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(b=>{if(b.dataset.w===qword[0])b.classList.add('correct');b.disabled=true});result.textContent=ok?`答对！${c.interval} 天后复习。`:`正确答案：${qword[0]}，10 分钟后再练。`;setTimeout(()=>startQuiz(qmode),1400)}resetDay();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
