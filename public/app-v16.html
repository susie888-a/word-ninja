<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>单词忍者</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="outer" src="app-v15.html" title="单词忍者"></iframe><script>const outer=document.getElementById('outer');function wire(){const middle=outer.contentWindow,innerFrame=middle.document.getElementById('app');if(!innerFrame)return setTimeout(wire,50);const w=innerFrame.contentWindow,d=w.document;function rank(){const state=JSON.parse(w.localStorage.getItem('ninja11')||'{}'),db=w.WORD_NINJA_IMPORTED||{},total=Object.values(db).reduce((n,g)=>n+g.length,0),vals=Object.values(state.counts||{}),once=vals.filter(v=>v>=1).length,three=vals.filter(v=>v>=3).length,twice=vals.filter(v=>v>=2).length,current=twice>=total?'god':three>=1000?'sage':once>=1000?'jonin':three>=600?'chunin':three>=300?'genin':'none',order=['genin','chunin','jonin','sage','god'];d.querySelectorAll('[data-r]').forEach(el=>{const i=order.indexOf(el.dataset.r),c=order.indexOf(current);el.classList.toggle('on',c>=i&&c>=0);el.classList.toggle('current',el.dataset.r===current)});const tip=d.getElementById('rankTip');if(tip)tip.textContent=`你距离神级忍者还差 ${Math.max(0,total-twice)} 个词汇（每词需记忆两遍），请继续修炼！`}const oldShow=w.show;w.show=function(id){const result=oldShow.apply(this,arguments);if(id==='settings')setTimeout(rank,0);return result};rank()}outer.addEventListener('load',()=>setTimeout(wire,50));</script></body></html>
