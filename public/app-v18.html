<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单词忍者</title><style>body{margin:0;background:#f7f5ef;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:560px;margin:auto;padding:18px 18px 85px}.hero,.card{border-radius:22px;padding:20px}.hero{background:#17324d;color:#fff}.hero h1{margin:6px 0;font-size:25px}.hero p{margin:0;color:#d3e0e6;font-size:13px}.stats,.levels,.modes,.actions,.options{display:grid;gap:9px}.stats{grid-template-columns:repeat(3,1fr);margin-top:16px}.stats div{background:#ffffff1b;border-radius:12px;padding:9px}.stats b,.stats small{display:block}.stats small{color:#d5e0e5;font-size:10px}.levels{grid-template-columns:repeat(3,1fr)}.modes,.actions,.options{grid-template-columns:1fr 1fr}.card{margin-top:14px;background:#fffdf8;border:1px solid #e8e4da;box-shadow:0 10px 28px #17324d10;text-align:center}.word{font:52px Georgia,serif;margin:16px 0 3px}.phone{color:#71808d}.example,.note,.meaning{margin-top:15px;border-radius:14px;padding:12px;text-align:left;line-height:1.6;font-size:14px}.example{background:#f1f8f4;font-style:italic;color:#426151}.meaning{background:#f7f6f0}.note{background:#fff3d9;color:#735b20}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:13px;font-weight:750}.levels button,.modes button,.options button{border:1px solid #e8e4da;background:#fff;color:#415464}.levels .on,.modes .on{border:2px solid #e87554;padding:12px;color:#17324d}.good{background:#348664;color:#fff}.bad{background:#fff0e8;color:#bd593c}.listen{margin-top:9px;background:#edf3f7;color:#17324d;padding:8px 11px;font-size:13px}.view{display:none}.view.on{display:block}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#f7f5efee;border-top:1px solid #e8e4da;text-align:center}.bottom button{background:none;color:#71808d}.bottom .on{color:#17324d}.prompt{padding:18px 3px;min-height:78px;font-size:20px;line-height:1.45}.result{min-height:22px;margin-top:10px;font-size:13px;font-weight:700}.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);display:none;background:#17324d;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px}</style><main class="app"><header><small style="color:#71808d">你好，</small><b id="hello">忍者</b></header><section id="learn" class="view on"><div class="hero"><small>ADAPTIVE REVIEW</small><h1>今天也悄悄变强</h1><p>优先复习到期、易忘和答错较多的单词。</p><div class="stats"><div><b id="done">0 / 20</b><small>今日完成</small></div><div><b id="rate">0%</b><small>今日正确率</small></div><div><b id="due">0</b><small>待复习</small></div></div></div><h3>词汇之路</h3><div id="levels" class="levels"><button data-l="basic">🌱 基础</button><button data-l="exam">🎯 考试</button><button data-l="pro">🥷 高阶</button></div><div class="card"><small id="kind">新词</small><div id="word" class="word"></div><div id="phone" class="phone"></div><button id="listen" class="listen">🔊 听发音</button><div id="example" class="example"></div><div class="actions"><button id="forget" class="bad">不记得</button><button id="remember" class="good">记得</button></div></div><div id="reason" class="note"></div></section><section id="detail" class="view"><button id="back" class="listen">← 返回</button><div class="card"><div id="dword" class="word"></div><div id="mean" class="meaning"></div><div id="dexample" class="example"></div><div class="actions"><button id="again" class="bad">还不熟</button><button id="master" class="good">掌握，下一词</button></div></div></section><section id="quiz" class="view"><div class="hero"><small>QUIZ DOJO</small><h1>小测验道场</h1><p>四种方式检验是否真的会用。</p></div><div id="modes" class="modes" style="margin-top:14px"><button data-m="cn">中译英选择</button><button data-m="audio">听音选词</button><button data-m="spell">拼写填空</button><button data-m="example">例句猜词</button></div><div class="card"><small id="qname"></small><div id="prompt" class="prompt"></div><div id="answers"></div><div id="result" class="result"></div></div></section></main><nav class="bottom"><button id="learnNav">🥷 背词</button><button id="quizNav">⚡ 测验</button></nav><div id="toast" class="toast"></div><script src="vocabulary-import.js"></script><script src="vocabulary-extra.js"></script><script>
(()=>{const $=id=>document.getElementById(id),D=window.WORD_NINJA_IMPORTED,day=()=>new Date().toLocaleDateString('sv-SE'),N=()=>Date.now(),DAY=864e5;let old=JSON.parse(localStorage.getItem('ninja11')||'null'),s=JSON.parse(localStorage.getItem('wordNinja18')||'null')||{name:old?.name||'忍者',level:old?.level||'basic',daily:old?.daily||20,day:day(),done:0,right:0,cards:{},seen:{}},cur,q,mode='cn',lock=0;const W=()=>D[s.level]||[],C=w=>s.cards[w]||{ok:0,bad:0,streak:0,due:0,interval:0},save=()=>localStorage.setItem('wordNinja18',JSON.stringify(s));function fix(){if(s.day!==day()){s.day=day();s.done=s.right=0;s.seen={};save()}}function hard(c){let n=c.ok+c.bad;return 1+(n?c.bad/n:.45)*1.8+Math.max(0,2-c.streak)*.18}function due(){return W().filter(w=>C(w[0]).due&&C(w[0]).due<=N())}function pick(){let d=due();if(d.length)return[d.sort((a,b)=>score(b)-score(a))[0],'复习'];let p=W().filter(w=>!s.cards[w[0]]&&!s.seen[w[0]]);if(p.length)return[p[Math.floor(Math.random()*p.length)],'新词'];p=W().filter(w=>!s.seen[w[0]]);if(!p.length){s.seen={};p=W()}return[p.sort((a,b)=>score(b)-score(a))[0],'巩固']}function score(w){let c=C(w[0]);return 100+hard(c)*20+Math.min(30,Math.max(0,N()-c.due)/DAY)*7+c.bad*3}function mean(w){return(Array.isArray(w[7])&&w[7][0])||w[3]||'暂无释义'}function say(w){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}}function stat(){fix();$('hello').textContent=s.name;$('done').textContent=`${s.done} / ${s.daily}`;$('rate').textContent=s.done?Math.round(s.right/s.done*100)+'%':'0%';$('due').textContent=due().length;document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x.dataset.l===s.level))}function draw(){fix();let x=pick();cur=x[0];$('kind').textContent=x[1];$('word').textContent=cur[0];$('phone').textContent=cur[1]||'';$('example').textContent=cur[5]||'先尝试回想词义，再查看答案。';let c=C(cur[0]);$('reason').textContent=x[1]==='复习'?`该词已到复习时间，过去答错 ${c.bad} 次。`:'这是待学习的新词，掌握后会自动安排间隔复习。';stat()}function view(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));$('learnNav').classList.toggle('on',v==='learn');$('quizNav').classList.toggle('on',v==='quiz');if(v==='learn')draw();if(v==='quiz'&&!q)quiz(mode)}function schedule(w,ok){let c={...C(w)},o=c.interval||0;if(ok){c.ok++;c.streak++;c.interval=c.streak===1?1:c.streak===2?3:Math.min(120,Math.round(Math.max(3,o)*(2.2-hard(c)*.2)));c.due=N()+c.interval*DAY}else{c.bad++;c.streak=0;c.interval=0;c.due=N()+600000}s.cards[w]=c;return c}function msg(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1800)}function rate(ok){let c=schedule(cur[0],ok);s.seen[cur[0]]=1;s.done++;if(ok)s.right++;save();msg(ok?`${c.interval} 天后复习`:'10 分钟后会再出现');view('learn')}function opts(w){let p=W().filter(x=>x[0]!==w[0]).sort(()=>Math.random()-.5).slice(0,3);return[w,...p].sort(()=>Math.random()-.5)}function quiz(m){mode=m;lock=0;q=pick()[0];$('qname').textContent={cn:'中译英选择',audio:'听音选词',spell:'拼写填空',example:'例句猜词'}[m];$('result').textContent='';document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x.dataset.m===m));let p='',a=$('answers');if(m==='cn')p=`请选择对应英文：<br>${mean(q)}`;if(m==='audio'){p='听发音，选择单词';setTimeout(()=>say(q[0]),100)}if(m==='example')p=`根据例句猜词：<br>“${q[5]||q[2]||''}”`;if(m==='spell'){p=`根据中文释义拼写：<br>${mean(q)}`;a.innerHTML='<input id="sp" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:18px"><button id="submit" class="good" style="width:100%;margin-top:9px">提交</button>';$('submit').onclick=()=>finish(($('sp').value||'').trim().toLowerCase()===q[0].toLowerCase());$('prompt').innerHTML=p;return}$('prompt').innerHTML=p;a.innerHTML='<div class="options">'+opts(q).map(x=>`<button data-w="${x[0]}">${x[0]}</button>`).join('')+'</div>';a.querySelectorAll('button').forEach(b=>b.onclick=()=>finish(b.dataset.w===q[0]))}function finish(ok){if(lock)return;lock=1;let c=schedule(q[0],ok);save();$('result').textContent=ok?`答对！${c.interval} 天后复习。`:`正确答案：${q[0]}，10 分钟后再练。`;setTimeout(()=>quiz(mode),1300)}document.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{s.level=x.dataset.l;s.seen={};save();draw()});document.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>quiz(x.dataset.m));$('listen').onclick=()=>say(cur[0]);$('forget').onclick=()=>rate(false);$('remember').onclick=()=>{$('dword').textContent=cur[0];$('mean').textContent=mean(cur);$('dexample').textContent=cur[5]||'';view('detail')};$('back').onclick=() => view('learn');$('again').onclick=()=>rate(false);$('master').onclick=()=>rate(true);$('learnNav').onclick=()=>view('learn');$('quizNav').onclick=()=>view('quiz');fix();draw()})();
</script>
