<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>单词忍者</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="app" src="app-v11.html" title="单词忍者"></iframe><script>const frame=document.getElementById('app');const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;w.toast=function(message){const el=d.getElementById('toast');if(!el)return;el.textContent=message;el.style.display='block';w.clearTimeout(w.__toastTimer);w.__toastTimer=w.setTimeout(()=>el.style.display='none',1800)};const oldDraw=w.draw;w.draw=function(){const result=oldDraw.apply(this,arguments),item=w.cur&&w.cur(),ex=d.getElementById('example');if(item&&ex)ex.textContent=item[5]||item[2];return result};const oldDetail=w.showDetail;w.showDetail=function(){const result=oldDetail.apply(this,arguments),item=w.cur&&w.cur();if(!item)return result;const meanings=Array.isArray(item[7])&&item[7].length?item[7]:[item[3]||'暂无中文释义'];const dd=d.getElementById('dd'),de=d.getElementById('de'),ox=d.getElementById('oxford');dd.innerHTML=`<span style="display:block;margin:8px 0">${meanings.slice(0,3).map((x,i)=>`${i+1}. ${esc(x)}`).join('　·　')}</span>`;de.innerHTML=`${esc(item[5]||item[2])}${item[8]?`<br><span style="display:block;margin-top:6px;font:13px/1.55 -apple-system;color:#71808d;font-style:normal">${esc(item[8])}</span>`:''}`;const details=Array.isArray(item[6])?item[6]:[];const shown=details.length>=3?details.slice(0,3):details.slice(0,1);ox.innerHTML=shown.length?`<label>词典用法 · 来源：牛津高阶词典</label>${shown.map((x,i)=>`<div class="sense" style="text-align:left"><b>${i+1}. ${esc(x.pos)}</b><br><strong style="color:#17324d">中文词义：${esc(meanings[i]||meanings[0])}</strong><br>英文定义：${esc(x.definition)}${x.example?`<br><em>英文例句：${esc(x.example)}</em>`:''}</div>`).join('')}`:'<label>词典用法 · 来源：牛津高阶词典</label><div class="sense" style="text-align:left">暂无可用的牛津高阶用法。</div>';return result};function updateRank(){const raw=JSON.parse(w.localStorage.getItem('ninja11')||'{}'),total=Object.values(w.DB||{}).reduce((n,g)=>n+g.length,0),values=Object.values(raw.counts||{}),once=values.filter(v=>v>=1).length,three=values.filter(v=>v>=3).length,twice=values.filter(v=>v>=2).length,current=twice>=total?'god':three>=1000?'sage':once>=1000?'jonin':three>=600?'chunin':three>=300?'genin':'none',order=['genin','chunin','jonin','sage','god'];d.querySelectorAll('[data-r]').forEach(x=>{const i=order.indexOf(x.dataset.r),c=order.indexOf(current);x.classList.toggle('on',c>=i&&c>=0);x.classList.toggle('current',x.dataset.r===current)});const tip=d.getElementById('rankTip');if(tip)tip.textContent=`你距离神级忍者还差 ${Math.max(0,total-twice)} 个词汇（每词需记忆两遍），请继续修炼！`}const oldShow=w.show;w.show=function(id){const result=oldShow.apply(this,arguments);if(id==='settings')setTimeout(updateRank,0);return result};updateRank();w.draw()});</script></body></html>
