<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>单词忍者</title><style>:root{--n:#17324d;--g:#3e9b76;--o:#ff865b;--b:#f7f5ef;--p:#fffdf8;--m:#71808d}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#202c36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:560px;margin:auto;padding:18px 18px 92px}.top,.head{display:flex;align-items:center;justify-content:space-between}.hello small{display:block;color:var(--m);font-size:11px}.hello b{font-size:20px;color:var(--n)}.pill{border-radius:11px;padding:7px 10px;background:#fff0e8;color:#c95735;font-size:12px;font-weight:700}.hero{margin-top:18px;background:var(--n);color:#fff;border-radius:26px;padding:23px}.hero h1{font-size:27px;margin:7px 0}.hero p{margin:0;color:#d3dfe5;font-size:14px}.track{height:8px;background:#ffffff2b;border-radius:9px;margin-top:19px}.track i{display:block;width:0;height:100%;border-radius:inherit;background:var(--o)}.metrics{display:flex;gap:10px;margin-top:15px}.metric{background:#ffffff18;border-radius:14px;padding:9px 11px;min-width:95px}.metric b,.metric span{display:block}.metric span{font-size:11px;color:#c8d8df}.head{margin:24px 2px 12px}.head h2{font-size:18px;margin:0}.link{border:0;background:none;color:var(--o);font-weight:700}.levels,.buttons,.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.level,.card{background:var(--p);border:1px solid #e8e4da;border-radius:18px}.level{padding:12px 9px;text-align:left}.level.active{border:2px solid var(--o);padding:11px 8px}.level b,.level span{display:block}.level b{margin-top:5px;font-size:14px}.level span{color:var(--m);font-size:11px}.card{padding:22px;box-shadow:0 12px 35px #17324d12}.wordcard{text-align:center}.word{font:52px Georgia;color:var(--n);margin:16px 0 4px}.phone{font-size:14px;color:var(--m)}.listen{margin-top:10px;border:0;border-radius:12px;padding:8px 12px;background:#edf3f7;color:var(--n);font-weight:700}.example,.def{margin-top:17px;border-radius:16px;padding:14px;background:#f2f8f5;text-align:left;line-height:1.7;font-size:14px}.example label{display:block;font-size:11px;font-weight:800;color:var(--g);margin-bottom:4px}.example{font-family:Georgia,serif;font-style:italic;color:#476050}.buttons{grid-template-columns:1fr 1fr;margin-top:16px}.buttons button{border:0;border-radius:16px;padding:15px;font-weight:800}.forget,.secondary{background:#fff0e8;color:#c75834}.remember,.primary{background:var(--g);color:#fff}.note{padding:14px;border-radius:16px;background:#fff4d8;color:#735b20;font-size:13px;line-height:1.6}.view{display:none}.view.active{display:block}.trophy{text-align:center}.cup{border:0;background:none;font-size:92px}.trophy h1{color:var(--n);margin:4px 0}.record{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:19px 0;text-align:left}.record div{padding:14px;border-radius:15px;background:#eef6f2}.record b{display:block;font-size:25px;color:var(--g)}.record span{font-size:12px;color:var(--m)}.field{padding:14px;border:1px solid #e8e4da;border-radius:15px;margin-bottom:12px}.field label{display:block;color:var(--m);font-size:13px;margin-bottom:8px}.field input{width:100%;padding:10px;border:1px solid #e8e4da;border-radius:10px}.moods button{border:1px solid #e8e4da;background:#fff;border-radius:12px;padding:10px;color:var(--m)}.moods button.active{border-color:var(--o);background:#fff0e8;color:#bd4e2e;font-weight:800}.daily{display:flex;align-items:center;gap:10px}.daily label{flex:1}.daily input{width:82px;padding:9px;border:1px solid #e8e4da;border-radius:10px;text-align:center}.rank{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.rank div{padding:9px 3px;border-radius:11px;background:#f0efeb;text-align:center;color:#9aa2a7;font-size:11px}.rank b{display:block;font-size:18px;margin-bottom:3px}.rank .on{background:#fff0d5;color:#9b6416;box-shadow:inset 0 0 0 1px #ffd48c}.rank .current{background:#17324d;color:#fff}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{padding:8px 1px;border:1px solid #e8e4da;border-radius:10px;text-align:center;font-size:11px;color:var(--m)}.day b{display:block;margin-top:3px;color:#202c36;font-size:15px}.day.done{background:#e9f5ef;border-color:#c7e4d6}.bottom{position:fixed;bottom:0;left:0;right:0;background:#f7f5efef;border-top:1px solid #e8e4da;display:flex;justify-content:center;gap:34px;padding:12px 20px}.nav{border:0;background:none;color:var(--m);font-size:12px}.nav.active{color:var(--n);font-weight:800}.nav span{display:block;font-size:20px}.toast{display:none;position:fixed;left:50%;bottom:82px;transform:translateX(-50%);padding:10px 14px;border-radius:13px;background:var(--n);color:#fff;font-size:13px}</style><body><main class="app"><header class="top"><div class="hello"><small>你好，亲爱的</small><b id="hello">忍者</b></div><span id="moodTop" class="pill">😊 愉快</span></header><section id="learn" class="view active"><div class="hero"><small>TODAY'S MISSION</small><h1>今天也要悄悄变强</h1><p>先回忆中文，再看词典例句与释义。</p><div class="track"><i id="bar"></i></div><div class="metrics"><div class="metric"><b id="progress">0 / 20</b><span>今日进度</span></div><div class="metric"><b id="rate">0%</b><span>今日记忆率</span></div></div></div><div class="head"><h2>选择词汇之路</h2><button class="link" onclick="show('settings')">设置</button></div><div class="levels"><button class="level active" data-l="basic" onclick="level(this)">🌱<b>启蒙基础</b><span>学前 · 小学</span></button><button class="level" data-l="exam" onclick="level(this)">🚀<b>考试进阶</b><span>考试 · 四六级</span></button><button class="level" data-l="pro" onclick="level(this)">🏆<b>高阶挑战</b><span>雅思 · 托福</span></button></div><div class="head"><h2>今日背诵</h2><span id="levelName" class="pill">启蒙基础</span></div><div class="card wordcard"><span class="pill">第 <span id="num">1</span> / <span id="total">20</span> 个</span><div id="word" class="word"></div><div id="phone" class="phone"></div><button class="listen" onclick="speak()">🔊 听美式发音</button><div class="example"><label>COLLINS EXAMPLE</label><span id="example"></span></div><div class="buttons"><button class="forget" onclick="forget()">不记得</button><button class="remember" onclick="reveal()">记得</button></div></div></section><section id="detail" class="view"><div class="head"><button class="link" onclick="show('learn')">‹ 返回单词</button><span class="pill">释义与用法</span></div><div class="card"><div id="dw" class="word" style="text-align:center"></div><div id="dp" class="phone" style="text-align:center"></div><div class="example"><label>COLLINS EXAMPLE</label><span id="de"></span></div><div class="def"><b style="color:var(--g)">中文释义</b><p id="dd"></p><b style="color:var(--g)">词典用法</b><p id="du"></p></div><div class="buttons"><button class="secondary" onclick="show('learn')">再想一想</button><button class="primary" onclick="mastered()">掌握了，下一个</button></div></div></section><section id="trophy" class="view"><div class="card trophy"><button class="cup" onclick="show('calendar')">🏆</button><h1>打卡成功！</h1><div class="record"><div><b id="recordWords">0</b><span>你已记忆个单词</span></div><div><b id="recordDays">0</b><span>你已坚持打卡天数</span></div></div><p style="font-weight:700;color:var(--o)">继续加油！</p><div class="buttons"><button class="secondary" onclick="show('calendar')">查看日历</button><button class="primary" onclick="show('learn')">明天再战</button></div></div></section><section id="calendar" class="view"><div class="head"><h2>打卡日历</h2><span class="pill">本月</span></div><div class="card"><div id="grid" class="cal"></div><div class="note" style="margin-top:14px">本月已完成 <b id="days">0</b> 天打卡。</div></div></section><section id="settings" class="view"><div class="head"><h2>我的设置</h2></div><div class="card"><div class="field"><label>我的昵称</label><input id="nickname" maxlength="16" onchange="setName(this.value)"></div><div class="field"><label>我的当日心情</label><div class="moods"><button data-m="happy" onclick="setMood('happy')">😊 愉快</button><button data-m="calm" onclick="setMood('calm')">😌 平静</button><button data-m="low" onclick="setMood('low')">😔 低落</button></div></div><div class="field daily"><label>每日打卡单词量<br><small>1–500 个</small></label><input id="daily" type="number" min="1" max="500" onchange="setDaily(this.value)"></div><div class="field"><label>忍者状态</label><div id="ranks" class="rank"><div data-r="genin"><b>🍃</b>下忍</div><div data-r="chunin"><b>⚔️</b>中忍</div><div data-r="jonin"><b>🌀</b>上忍</div><div data-r="sage"><b>🧙</b>仙级</div><div data-r="god"><b>✨</b>神级</div></div><div id="rankTip" class="note" style="margin-top:12px"></div></div></div></section></main><nav class="bottom"><button class="nav active" data-v="learn" onclick="show('learn')"><span>🥷</span>背诵</button><button class="nav" data-v="calendar" onclick="show('calendar')"><span>🗓</span>日历</button><button class="nav" data-v="settings" onclick="show('settings')"><span>⚙️</span>设置</button></nav><div id="toast" class="toast"></div><script src="vocabulary-import.js"></script><script>const F={basic:[['apple','','','苹果','苹果','I want an apple.']],exam:[['analyze','','','分析','分析','We need to analyze the results.']],pro:[['sustainable','','','可持续的','可持续的','We need sustainable solutions.']]};const DB=window.WORD_NINJA_IMPORTED||F,LBL={basic:'启蒙基础',exam:'考试进阶',pro:'高阶挑战'},MOOD={happy:'😊 愉快',calm:'😌 平静',low:'😔 低落'},today=()=>new Date().toLocaleDateString('sv-SE');let old=JSON.parse(localStorage.getItem('ninja7')||'null')||JSON.parse(localStorage.getItem('ninja6')||'null'),s=JSON.parse(localStorage.getItem('ninja8')||'null')||old||{date:today(),daily:20,level:'basic',i:0,done:0,ok:0,name:'忍者',mood:'happy',history:{},totalLearned:0,masteredWords:{}};s.masteredWords=s.masteredWords||{};if(s.date!==today()){s.date=today();s.done=0;s.ok=0;s.i=0}let ws=DB[s.level];function save(){localStorage.setItem('ninja8',JSON.stringify(s))}function cur(){return ws[s.i%ws.length]}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===(id==='detail'||id==='trophy'?'learn':id)));if(id==='calendar')cal();if(id==='trophy')record();if(id==='settings')rank();scrollTo(0,0)}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}function profile(){hello.textContent=s.name||'忍者';nickname.value=s.name||'';moodTop.textContent=MOOD[s.mood];document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x.dataset.m===s.mood))}function draw(){let w=cur();word.textContent=w[0];phone.textContent=w[1]||'音标待补充';example.textContent=w[5]||w[2];num.textContent=Math.min(s.done+1,s.daily);total.textContent=s.daily;progress.textContent=s.done+' / '+s.daily;bar.style.width=Math.min(100,s.done/s.daily*100)+'%';rate.textContent=(s.done?Math.round(s.ok/s.done*100):0)+'%';daily.value=s.daily;profile()}function level(e){document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));e.classList.add('active');s.level=e.dataset.l;ws=DB[s.level];s.i=0;levelName.textContent=LBL[s.level];save();draw()}function setName(x){s.name=x.trim()||'忍者';save();profile()}function setMood(x){s.mood=x;save();profile()}function setDaily(x){s.daily=Math.max(1,Math.min(500,+x||20));save();draw()}function forget(){s.i++;save();draw();toast('没关系，它会再次出现')}function reveal(){let w=cur();dw.textContent=w[0];dp.textContent=w[1]||'';de.textContent=w[5]||w[2];dd.textContent=w[3];du.textContent=w[4];show('detail')}function mastered(){let w=cur()[0];s.done++;s.ok++;s.totalLearned=(s.totalLearned||0)+1;s.masteredWords[w]=(s.masteredWords[w]||0)+1;let complete=s.done>=s.daily;if(complete){s.history[today()]={words:s.done};toast('今日打卡成功！')}else{s.i++;toast('记忆成功，继续下一词')}save();if(complete)show('trophy');else{show('learn');draw()}draw()}function record(){recordWords.textContent=s.totalLearned||0;recordDays.textContent=Object.keys(s.history).length}function speak(){let u=new SpeechSynthesisUtterance(cur()[0]);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function rank(){let total=Object.values(DB).reduce((n,g)=>n+g.length,0),vals=Object.values(s.masteredWords),once=vals.filter(n=>n>=1).length,thrice=vals.filter(n=>n>=3).length,current=once>=total?'god':thrice>=1000?'sage':once>=1000?'jonin':thrice>=600?'chunin':thrice>=300?'genin':'none';let order=['genin','chunin','jonin','sage','god'];document.querySelectorAll('[data-r]').forEach(x=>{let i=order.indexOf(x.dataset.r),c=order.indexOf(current);x.classList.toggle('on',current!=='none'&&i<=c);x.classList.toggle('current',x.dataset.r===current)});rankTip.textContent=`你距离神级忍者还差 ${Math.max(0,total-once)} 个词汇，请继续修炼！`}function cal(){let e=grid,h=['日','一','二','三','四','五','六'],d=new Date(),y=d.getFullYear(),m=d.getMonth(),max=new Date(y,m+1,0).getDate(),pad=new Date(y,m,1).getDay();e.innerHTML=h.map(x=>'<div class="day" style="border:0;background:transparent;font-weight:700">'+x+'</div>').join('')+Array(pad).fill('<div></div>').join('');for(let n=1;n<=max;n++){let k=new Date(y,m,n).toLocaleDateString('sv-SE'),yes=!!s.history[k];e.innerHTML+='<div class="day '+(yes?'done':'')+'">'+(yes?'✓':'')+'<b>'+n+'</b></div>'}days.textContent=Object.keys(s.history).length}draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
