<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>单词忍者</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="app" src="app-v11.html" title="单词忍者"></iframe><script>const frame=document.getElementById('app');const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;const oldToast=w.toast;w.toast=function(message){const el=d.getElementById('toast');if(!el)return;el.textContent=message;el.style.display='block';w.clearTimeout(w.__toastTimer);w.__toastTimer=w.setTimeout(()=>el.style.display='none',1800)};const oldDraw=w.draw;w.draw=function(){const result=oldDraw.apply(this,arguments),item=w.cur&&w.cur();const ex=d.getElementById('example');if(item&&ex){ex.innerHTML=`${esc(item[5]||item[2])}${item[8]?`<br><span style="display:block;margin-top:6px;font:13px/1.55 -apple-system;color:#71808d;font-style:normal">${esc(item[8])}</span>`:''}`}return result};const oldDetail=w.showDetail;w.showDetail=function(){const result=oldDetail.apply(this,arguments),item=w.cur&&w.cur();if(!item)return result;const meanings=Array.isArray(item[7])&&item[7].length?item[7]:[item[3]||'暂无中文释义'];const dd=d.getElementById('dd'),de=d.getElementById('de'),ox=d.getElementById('oxford');dd.innerHTML=`<b style="color:#3e9b76">中文释义</b>${meanings.slice(0,3).map((x,i)=>`<p style="margin:8px 0">${i+1}. ${esc(x)}</p>`).join('')}`;de.innerHTML=`${esc(item[5]||item[2])}${item[8]?`<br><span style="display:block;margin-top:6px;font:13px/1.55 -apple-system;color:#71808d;font-style:normal">${esc(item[8])}</span>`:''}`;const details=Array.isArray(item[6])?item[6]:[];ox.innerHTML=details.length?`<label>词典用法 · 来源：牛津高阶词典</label>${details.slice(0,3).map((x,i)=>`<div class="sense" style="text-align:left"><b>${i+1}. ${esc(x.pos)}</b><br><strong style="color:#17324d">中文词义：${esc(meanings[i]||meanings[0])}</strong><br>英文定义：${esc(x.definition)}${x.example?`<br><em>英文例句：${esc(x.example)}</em>`:''}</div>`).join('')}`:'<label>词典用法 · 来源：牛津高阶词典</label><div class="sense" style="text-align:left">该词在牛津高阶词典中不足三种常用释义，当前展示中文基础义项。</div>';return result};w.draw()});</script></body></html>
