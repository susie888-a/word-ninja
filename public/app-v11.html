<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>单词忍者</title><style>:root{--n:#17324d;--g:#3e9b76;--o:#ff865b;--bg:#f7f5ef;--p:#fffdf8;--m:#71808d;--line:#e8e4da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202c36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:560px;margin:auto;padding:18px 18px 94px}.top,.head{display:flex;justify-content:space-between;align-items:center}.hello small{display:block;color:var(--m);font-size:11px}.hello b{font-size:20px;color:var(--n)}.pill{background:#fff0e8;color:#c95735;padding:7px 10px;border-radius:11px;font-size:12px;font-weight:700}.hero{background:var(--n);color:#fff;padding:23px;border-radius:26px;margin-top:18px}.hero h1{font-size:27px;margin:7px 0}.hero p{margin:0;color:#d3dfe5;font-size:14px}.track{height:8px;background:#ffffff2b;border-radius:8px;margin:19px 0 0}.track i{display:block;height:100%;width:0;background:var(--o);border-radius:inherit}.metrics{display:flex;gap:10px;margin-top:15px}.metric{background:#ffffff18;border-radius:14px;padding:9px 11px;min-width:95px}.metric b,.metric span{display:block}.metric span{font-size:11px;color:#c8d8df}.head{margin:24px 2px 12px}.head h2{font-size:18px;margin:0}.link{border:0;background:none;color:var(--o);font-weight:700}.levels,.buttons,.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.level,.card{background:var(--p);border:1px solid var(--line);border-radius:18px}.level{padding:12px 9px;text-align:left}.level.active{border:2px solid var(--o);padding:11px 8px}.level b,.level span{display:block}.level b{font-size:14px;margin-top:5px}.level span{color:var(--m);font-size:11px}.card{padding:22px;box-shadow:0 12px 35px #17324d12}.wordcard{text-align:center}.word{font:52px Georgia;color:var(--n);margin:16px 0 4px}.phone{font-size:14px;color:var(--m)}.listen{border:0;border-radius:12px;padding:8px 12px;background:#edf3f7;color:var(--n);font-weight:700;margin-top:10px}.example,.def,.oxford{margin-top:17px;border-radius:16px;padding:14px;background:#f2f8f5;text-align:left;line-height:1.7;font-size:14px}.example{font:italic 14px/1.7 Georgia,serif;color:#476050}.example label,.oxford label{display:block;font:800 11px -apple-system;color:var(--g);margin-bottom:4px}.buttons{grid-template-columns:1fr 1fr;margin-top:16px}.buttons button{border:0;border-radius:16px;padding:15px;font-weight:800}.forget,.secondary{background:#fff0e8;color:#c75834}.remember,.primary{background:var(--g);color:#fff}.note{padding:14px;border-radius:16px;background:#fff4d8;color:#735b20;font-size:13px;line-height:1.65}.view{display:none}.view.active{display:block}.trophy{text-align:center}.cup{border:0;background:none;font-size:92px}.record{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:19px 0;text-align:left}.record div{padding:14px;border-radius:15px;background:#eef6f2}.record b{display:block;color:var(--g);font-size:25px}.record span{font-size:12px;color:var(--m)}.field{padding:14px;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.field label{display:block;color:var(--m);font-size:13px;margin-bottom:8px}.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.daily{display:flex;align-items:center;gap:10px}.daily label{flex:1}.daily input{width:80px}.moods button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;color:var(--m)}.moods button.active{background:#fff0e8;border-color:var(--o);color:#bd4e2e;font-weight:800}.rank{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.rank div{padding:9px 3px;border-radius:11px;background:#f0efeb;text-align:center;color:#9aa2a7;font-size:11px}.rank b{display:block;font-size:18px}.rank .on{background:#fff0d5;color:#9b6416}.rank .current{background:var(--n);color:#fff}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{padding:8px 1px;border:1px solid var(--line);border-radius:10px;text-align:center;color:var(--m);font-size:11px}.day b{display:block;color:#202c36;font-size:15px;margin-top:3px}.day.done{background:#e9f5ef;border-color:#c7e4d6}.chart{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.bottom{position:fixed;inset:auto 0 0;background:#f7f5efef;border-top:1px solid var(--line);display:flex;justify-content:center;gap:34px;padding:12px 20px calc(12px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:var(--m);font-size:12px}.nav.active{color:var(--n);font-weight:800}.nav span{display:block;font-size:20px}.toast{display:none;position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 14px;border-radius:13px;font-size:13px;z-index:5}.sense{padding:10px 0;border-top:1px solid #d7e9df}.sense:first-of-type{border-top:0}.sense b{color:var(--g)}</style></head><body><main class="app"><header class="top"><div class="hello"><small>你好，亲爱的</small><b id="hello">忍者</b></div><span class="pill" id="moodTop">😊 愉快</span></header><section id="learn" class="view active"><div class="hero"><small>TODAY'S MISSION</small><h1>今天也要悄悄变强</h1><p>单词顺序已随机，每天从新的目标开始。</p><div class="track"><i id="bar"></i></div><div class="metrics"><div class="metric"><b id="progress">0 / 20</b><span>今日进度</span></div><div class="metric"><b id="rate">0%</b><span>今日记忆率</span></div></div></div><div class="head"><h2>选择词汇之路</h2><button class="link" onclick="show('settings')">设置</button></div><div class="levels"><button class="level active" data-l="basic" onclick="setLevel(this)">🌱<b>启蒙基础</b><span>学前 · 小学</span></button><button class="level" data-l="exam" onclick="setLevel(this)">🚀<b>考试进阶</b><span>考试 · 四六级</span></button><button class="level" data-l="pro" onclick="setLevel(this)">🏆<b>高阶挑战</b><span>雅思 · 托福</span></button></div><div class="head"><h2>今日背诵</h2><span class="pill" id="levelName">启蒙基础</span></div><div class="card wordcard"><span class="pill">第 <span id="num">1</span> / <span id="total">20</span> 个</span><div id="word" class="word"></div><div id="phone" class="phone"></div><button class="listen" onclick="speak()">🔊 听美式发音</button><div class="example"><label>COLLINS EXAMPLE</label><span id="example"></span></div><div class="buttons"><button class="forget" onclick="forget()">不记得</button><button class="remember" onclick="showDetail()">记得</button></div></div><div class="head"><h2>艾宾浩斯复习提醒</h2></div><div class="note">✨ <b id="reviewCount">0</b> 个词今天建议复习。系统在第 1、2、4、7、15、30 天安排回顾。</div></section><section id="detail" class="view"><div class="head"><button class="link" onclick="show('learn')">‹ 返回单词</button><span class="pill">释义与用法</span></div><div class="card"><div id="dw" class="word" style="text-align:center"></div><div id="dp" class="phone" style="text-align:center"></div><div class="example"><label>COLLINS EXAMPLE</label><span id="de"></span></div><div class="def"><b style="color:var(--g)">中文释义</b><p id="dd"></p></div><div id="oxford" class="oxford"></div><div class="buttons"><button class="secondary" onclick="show('learn')">再想一想</button><button class="primary" onclick="mastered()">掌握了，下一个</button></div></div></section><section id="trophy" class="view"><div class="card trophy"><button class="cup" onclick="show('calendar')">🏆</button><h1>打卡成功！</h1><div class="record"><div><b id="recordWords">0</b><span>你已记忆个单词</span></div><div><b id="recordDays">0</b><span>你已坚持打卡天数</span></div></div><p style="color:var(--o);font-weight:800">继续加油！</p><div class="buttons"><button class="secondary" onclick="show('calendar')">查看日历</button><button class="primary" onclick="show('learn')">明天再战</button></div></div></section><section id="calendar" class="view"><div class="head"><h2>打卡日历</h2><span class="pill">本月</span></div><div class="card"><div id="grid" class="cal"></div><div class="note" style="margin-top:14px">本月已完成 <b id="days">0</b> 天打卡。</div><div class="chart"><div style="display:flex;justify-content:space-between"><b style="color:var(--n)">记忆曲线</b><span style="font-size:11px;color:var(--m)">X轴：日期 · Y轴：记忆单词量</span></div><svg id="memorySvg" viewBox="0 0 340 220" style="width:100%;height:220px;display:block"></svg></div></div></section><section id="settings" class="view"><div class="head"><h2>我的设置</h2></div><div class="card"><div class="field"><label>我的昵称</label><input id="nickname" maxlength="16" onchange="setName(this.value)"></div><div class="field"><label>我的当日心情</label><div class="moods"><button data-m="happy" onclick="setMood('happy')">😊 愉快</button><button data-m="calm" onclick="setMood('calm')">😌 平静</button><button data-m="low" onclick="setMood('low')">😔 低落</button></div></div><div class="field daily"><label>每日打卡单词量<br><small>每天将自动重置</small></label><input id="daily" type="number" min="1" max="500" onchange="setDaily(this.value)"></div><div class="field"><label>忍者状态</label><div id="ranks" class="rank"><div data-r="genin"><b>🍃</b>下忍</div><div data-r="chunin"><b>⚔️</b>中忍</div><div data-r="jonin"><b>🌀</b>上忍</div><div data-r="sage"><b>🧙</b>仙级</div><div data-r="god"><b>✨</b>神级</div></div><div id="rankTip" class="note" style="margin-top:12px"></div></div></div></section></main><nav class="bottom"><button class="nav active" data-v="learn" onclick="show('learn')"><span>🥷</span>背诵</button><button class="nav" data-v="calendar" onclick="show('calendar')"><span>🗓</span>日历</button><button class="nav" data-v="settings" onclick="show('settings')"><span>⚙️</span>设置</button></nav><div id="toast" class="toast"></div><script src="vocabulary-import.js"></script><script>const DB=window.WORD_NINJA_IMPORTED,LBL={basic:'启蒙基础',exam:'考试进阶',pro:'高阶挑战'},MOOD={happy:'😊 愉快',calm:'😌 平静',low:'😔 低落'},DAYS=[1,2,4,7,15,30],today=()=>new Date().toLocaleDateString('sv-SE');let s=JSON.parse(localStorage.getItem('ninja11')||'null')||{day:today(),daily:20,level:'basic',dayDone:0,dayCorrect:0,name:'忍者',mood:'happy',history:{},totalLearned:0,counts:{},queues:{},reviews:[]};function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function freshQueue(level){return shuffle(DB[level].map(x=>x[0]))}function ensureDay(){if(s.day!==today()){s.day=today();s.dayDone=0;s.dayCorrect=0;s.queues={};save()}}function queue(){let q=s.queues[s.level];if(!q||!q.length){q=freshQueue(s.level);s.queues[s.level]=q}return q}function cur(){let key=queue()[0];return DB[s.level].find(x=>x[0]===key)||DB[s.level][0]}function save(){localStorage.setItem('ninja11',JSON.stringify(s))}function show(id){ensureDay();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===(id==='detail'||id==='trophy'?'learn':id)));if(id==='calendar')calendar();if(id==='trophy')record();if(id==='settings')rank();draw();scrollTo(0,0)}function toast(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.t);window.t=setTimeout(()=>toast.style.display='none',1800)}function profile(){hello.textContent=s.name||'忍者';nickname.value=s.name||'';moodTop.textContent=MOOD[s.mood];document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x.dataset.m===s.mood))}function draw(){ensureDay();let w=cur();word.textContent=w[0];phone.textContent=w[1]||'音标待补充';example.textContent=w[5]||w[2];num.textContent=Math.min(s.dayDone+1,s.daily);total.textContent=s.daily;progress.textContent=`${s.dayDone} / ${s.daily}`;bar.style.width=Math.min(100,s.dayDone/s.daily*100)+'%';rate.textContent=s.dayDone?Math.round(s.dayCorrect/s.dayDone*100)+'%':'0%';daily.value=s.daily;reviewCount.textContent=s.reviews.filter(x=>x.due===today()).length;profile()}function setLevel(el){document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));el.classList.add('active');s.level=el.dataset.l;levelName.textContent=LBL[s.level];save();draw()}function setName(v){s.name=v.trim()||'忍者';save();profile()}function setMood(v){s.mood=v;save();profile()}function setDaily(v){s.daily=Math.max(1,Math.min(500,+v||20));save();draw()}function advance(){let q=queue();q.push(q.shift());save()}function forget(){advance();toast('没关系，它会在本轮随机队列中再次出现');draw()}function showDetail(){let w=cur();dw.textContent=w[0];dp.textContent=w[1]||'';de.textContent=w[5]||w[2];dd.textContent=w[3];let details=w[6];oxford.innerHTML=Array.isArray(details)&&details.length?'<label>OXFORD ADVANCED USAGE</label>'+details.map((x,i)=>`<div class="sense"><b>${i+1}. ${x.pos}</b><br>${x.definition}${x.example?`<br><em>例句：${x.example}</em>`:''}</div>`).join(''):'<label>OXFORD ADVANCED USAGE</label>该词在牛津高阶词典中不足三种常用释义；当前展示基础释义。';show('detail')}function mastered(){let w=cur()[0];s.dayDone++;s.dayCorrect++;s.totalLearned++;s.counts[w]=(s.counts[w]||0)+1;DAYS.forEach(d=>{let due=new Date();due.setDate(due.getDate()+d);s.reviews.push({word:w,due:due.toLocaleDateString('sv-SE')})});let complete=s.dayDone>=s.daily;if(complete){s.history[today()]={words:s.dayDone};toast('今日打卡成功！')}else{advance();toast('记忆成功，继续下一词')}save();if(complete)show('trophy');else show('learn')}function speak(){let u=new SpeechSynthesisUtterance(cur()[0]);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function record(){recordWords.textContent=s.totalLearned;recordDays.textContent=Object.keys(s.history).length}function rank(){let total=Object.values(DB).reduce((n,g)=>n+g.length,0),vals=Object.values(s.counts),once=vals.filter(v=>v>=1).length,three=vals.filter(v=>v>=3).length,current=once>=total?'god':three>=1000?'sage':once>=1000?'jonin':three>=600?'chunin':three>=300?'genin':'none',order=['genin','chunin','jonin','sage','god'];document.querySelectorAll('[data-r]').forEach(x=>{let i=order.indexOf(x.dataset.r),c=order.indexOf(current);x.classList.toggle('on',c>=i&&c>=0);x.classList.toggle('current',x.dataset.r===current)});rankTip.textContent=`你距离神级忍者还差 ${Math.max(0,total-once)} 个词汇，请继续修炼！`}function calendar(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),max=new Date(y,m+1,0).getDate(),pad=new Date(y,m,1).getDay(),h=['日','一','二','三','四','五','六'];grid.innerHTML=h.map(x=>`<div class="day" style="border:0;background:transparent;font-weight:700">${x}</div>`).join('')+Array(pad).fill('<div></div>').join('');for(let n=1;n<=max;n++){let k=new Date(y,m,n).toLocaleDateString('sv-SE'),yes=!!s.history[k];grid.innerHTML+=`<div class="day ${yes?'done':''}">${yes?'✓':''}<b>${n}</b></div>`}days.textContent=Object.keys(s.history).length;curve()}function curve(){let ds=[],now=new Date();for(let i=6;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);ds.push(d)}let vs=ds.map(d=>(s.history[d.toLocaleDateString('sv-SE')]||{words:0}).words),M=Math.max(5,...vs),W=340,H=220,L=34,R=10,T=20,B=34,pw=W-L-R,ph=H-T-B,pts=vs.map((v,i)=>`${L+i*pw/6},${T+ph-v/M*ph}`).join(' '),lines=[0,1,2,3].map(i=>{let y=T+i*ph/3;return`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e6e8e7"/><text x="2" y="${y+4}" fill="#71808d" font-size="10">${Math.round(M*(1-i/3))}</text>`}).join(''),labels=ds.map((d,i)=>`<text x="${L+i*pw/6}" y="${H-9}" text-anchor="middle" fill="#71808d" font-size="10">${d.getMonth()+1}/${d.getDate()}</text>`).join(''),dots=vs.map((v,i)=>`<circle cx="${L+i*pw/6}" cy="${T+ph-v/M*ph}" r="4" fill="#ff865b"/>`).join('');memorySvg.innerHTML=lines+`<polyline points="${pts}" fill="none" stroke="#3e9b76" stroke-width="3" stroke-linecap="round"/>`+dots+labels}ensureDay();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
