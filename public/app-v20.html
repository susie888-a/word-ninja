<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单词忍者</title><style>body{margin:0;background:#f7f5ef;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:560px;margin:auto;padding:22px 18px 85px}.hero,.card{border-radius:20px;padding:20px}.hero{background:#17324d;color:#fff}.hero h1{margin:5px 0;font-size:25px}.hero p{margin:0;color:#d6e1e6;font-size:13px}.stats,.choices,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stats{grid-template-columns:repeat(3,1fr);margin-top:15px}.stats div{background:#ffffff1d;border-radius:12px;padding:9px}.stats b,.stats small{display:block}.stats small{font-size:10px;color:#d6e1e6}.card{margin-top:15px;background:#fffdf8;border:1px solid #e8e4da;text-align:center;box-shadow:0 10px 28px #17324d10}.word{font:51px Georgia,serif;margin:16px 0 4px}.phone{color:#71808d}.example,.note{margin-top:15px;padding:12px;border-radius:13px;text-align:left;line-height:1.6;font-size:14px}.example{background:#f1f8f4;color:#426151;font-style:italic}.note{background:#fff3d9;color:#735b20}button{border:0;border-radius:13px;padding:13px;font:700 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.good{background:#348664;color:#fff}.bad{background:#fff0e8;color:#bd593c}.plain,.choice{background:#edf3f7;color:#17324d}.choice{border:1px solid #e8e4da;background:#fff;min-height:50px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#f7f5efee;border-top:1px solid #e8e4da;padding:11px;text-align:center}.bottom button{background:none;color:#71808d}.bottom button.on{color:#17324d}.view{display:none}.view.on{display:block}.result{min-height:23px;margin-top:12px;font-weight:700;font-size:13px}.input{width:100%;padding:13px;border:1px solid #e8e4da;border-radius:12px;font-size:18px;text-align:center;box-sizing:border-box}.toast{display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#17324d;color:white;padding:10px 14px;border-radius:12px;font-size:13px}</style></head><body><main class="app"><section id="learn" class="view on"><div class="hero"><small>ADAPTIVE REVIEW</small><h1>单词忍者</h1><p>到期、易忘和答错较多的词优先复习。</p><div class="stats"><div><b id="done">0</b><small>今日练习</small></div><div><b id="due">0</b><small>待复习</small></div><div><b id="total">0</b><small>词库</small></div></div></div><div class="card"><small id="tag">新词</small><div id="word" class="word">loading</div><div id="phone" class="phone"></div><button id="sound" class="plain">🔊 听发音</button><div id="example" class="example">正在加载词库…</div><div class="actions"><button id="no" class="bad">不记得</button><button id="yes" class="good">记得</button></div></div><div id="reason" class="note">系统会根据你的反馈自动安排复习。</div></section><section id="quiz" class="view"><div class="hero"><small>QUIZ DOJO</small><h1>小测验</h1><p>中译英、听音、拼写和例句猜词。</p></div><div class="choices" style="margin-top:15px"><button data-mode="cn" class="plain">中译英选择</button><button data-mode="audio" class="plain">听音选词</button><button data-mode="spell" class="plain">拼写填空</button><button data-mode="example" class="plain">例句猜词</button></div><div class="card"><div id="question" class="word" style="font-size:21px;line-height:1.5">选择一种测验模式</div><div id="answers"></div><div id="result" class="result"></div></div></section></main><nav class="bottom"><button id="learnBtn" class="on">🥷 背词</button><button id="quizBtn">⚡ 测验</button></nav><div id="toast" class="toast"></div><script src="vocabulary-import.js"></script><script src="vocabulary-extra.js"></script><script>
(function(){'use strict';var $=function(id){return document.getElementById(id)},fallback={basic:[['apple','','','苹果','','An apple is a fruit.','','苹果'],['brave','','','勇敢的','','She is brave.','','勇敢的'],['focus','','','专注','','Focus on your goal.','','专注'],['journey','','','旅程','','The journey begins.','','旅程']]};var DB=window.WORD_NINJA_IMPORTED||fallback,level='basic',now=function(){return new Date().getTime()},data,cur,quiz,mode='cn';try{data=JSON.parse(localStorage.getItem('ninjaSafe')||'{}')}catch(e){data={}}if(!data.cards)data.cards={};if(!data.done)data.done=0;function save(){try{localStorage.setItem('ninjaSafe',JSON.stringify(data))}catch(e){}}function list(){return DB[level]&&DB[level].length?DB[level]:fallback.basic}function card(w){return data.cards[w]||{ok:0,bad:0,due:0}}function pick(){var a=list(),due=[],i,c;for(i=0;i<a.length;i++){c=card(a[i][0]);if(c.due&&c.due<=now())due.push(a[i])}if(due.length){due.sort(function(x,y){var a=card(x[0]),b=card(y[0]);return(b.bad-a.bad)||(a.due-b.due)});return[due[0],'复习']}return[a[Math.floor(Math.random()*a.length)],'新词']}function say(w){if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(w);u.lang='en-US';window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}}function meaning(w){return(w[7]&&w[7][0])||w[3]||'暂无释义'}function draw(){var x=pick(),c;cur=x[0];c=card(cur[0]);$('word').textContent=cur[0];$('phone').textContent=cur[1]||'';$('example').textContent=cur[5]||'先回忆词义，再查看答案。';$('tag').textContent=x[1];$('reason').textContent=x[1]==='复习'?'该词已到复习时间，过去答错 '+c.bad+' 次。':'这是新词；记得后会自动安排间隔复习。';$('done').textContent=data.done;$('due').textContent=dueNumber();$('total').textContent=list().length}function dueNumber(){var a=list(),i,n=0;for(i=0;i<a.length;i++)if(card(a[i][0]).due<=now()&&card(a[i][0]).due)n++;return n}function rate(ok){var c=card(cur[0]);if(ok){c.ok++;c.due=now()+Math.min(30,Math.max(1,c.ok*2))*86400000}else{c.bad++;c.due=now()+600000}data.cards[cur[0]]=c;data.done++;save();toast(ok?'已安排下次间隔复习':'10 分钟后会重新出现');draw()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(function(){$('toast').style.display='none'},1600)}function show(v){$('learn').className='view'+(v==='learn'?' on':'');$('quiz').className='view'+(v==='quiz'?' on':'');$('learnBtn').className=v==='learn'?'on':'';$('quizBtn').className=v==='quiz'?'on':'';if(v==='learn')draw()}function options(w){var a=list().slice(),r=[w];while(r.length<4&&a.length){var x=a.splice(Math.floor(Math.random()*a.length),1)[0];if(x[0]!==w[0])r.push(x)}return r.sort(function(){return Math.random()-.5})}function quizDraw(m){mode=m;quiz=pick()[0];var q='',a=$('answers'),opts,i;if(m==='cn')q='请选择英文：<br>'+meaning(quiz);if(m==='audio'){q='听发音，选择单词';setTimeout(function(){say(quiz[0])},100)}if(m==='example')q='根据例句猜词：<br>“'+(quiz[5]||'')+'”';if(m==='spell'){q='根据中文释义拼写：<br>'+meaning(quiz);a.innerHTML='<input id="spell" class="input"><button id="submit" class="good" style="width:100%;margin-top:8px">提交</button>';$('submit').onclick=function(){finish(($('spell').value||'').toLowerCase()===quiz[0].toLowerCase())};$('question').innerHTML=q;return}$('question').innerHTML=q;opts=options(quiz);a.innerHTML='<div class="choices">'+opts.map(function(w){return'<button class="choice" data-w="'+w[0]+'">'+w[0]+'</button>'}).join('')+'</div>';var bs=a.getElementsByTagName('button');for(i=0;i<bs.length;i++)bs[i].onclick=function(){finish(this.getAttribute('data-w')===quiz[0])}}function finish(ok){var c=card(quiz[0]);if(ok){c.ok++;c.due=now()+86400000}else{c.bad++;c.due=now()+600000}data.cards[quiz[0]]=c;save();$('result').textContent=ok?'答对！已更新复习间隔。':'正确答案：'+quiz[0];setTimeout(function(){quizDraw(mode)},1300)}$('sound').onclick=function(){say(cur[0])};$('yes').onclick=function(){rate(true)};$('no').onclick=function(){rate(false)};$('learnBtn').onclick=function(){show('learn')};$('quizBtn').onclick=function(){show('quiz')};var mb=document.querySelectorAll('[data-mode]'),j;for(j=0;j<mb.length;j++)mb[j].onclick=function(){quizDraw(this.getAttribute('data-mode'))};draw()})();
</script></body></html>
