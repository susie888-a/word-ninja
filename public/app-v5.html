<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>单词忍者</title><style>:root{--n:#17324d;--o:#ff865b;--g:#3e9b76;--bg:#f7f5ef;--p:#fffdf8;--m:#71808d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202c36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:560px;margin:auto;padding:18px 18px 94px}.top,.head{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;color:var(--n)}.brand small{display:block;color:var(--m);font-size:11px}.brand b{font-size:19px}.mood,.pill{border-radius:12px;padding:7px 10px;background:#fff0e8;color:#c95837;font-size:12px;font-weight:700}.hero{margin-top:18px;background:var(--n);color:#fff;border-radius:26px;padding:23px}.hero h1{font-size:27px;margin:7px 0}.hero p{font-size:14px;color:#d4e0e6;margin:0}.track{height:8px;background:#ffffff2b;border-radius:8px;margin-top:19px}.track i{display:block;width:0;height:100%;background:var(--o);border-radius:inherit}.metrics{display:flex;gap:10px;margin-top:15px}.metric{background:#ffffff18;border-radius:14px;padding:9px 11px;min-width:94px}.metric b,.metric span{display:block}.metric span{font-size:11px;color:#c7d8df}.head{margin:25px 2px 12px}.head h2{font-size:18px;margin:0}.link{background:none;border:0;color:var(--o);font-weight:700}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.level,.card{background:var(--p);border:1px solid #e8e4da;border-radius:18px}.level{padding:12px 9px;text-align:left}.level.active{border:2px solid var(--o);padding:11px 8px}.level b,.level span{display:block}.level b{font-size:14px;margin-top:5px}.level span{font-size:11px;color:var(--m);margin-top:3px}.card{padding:22px;box-shadow:0 12px 35px #17324d12}.word-card{text-align:center}.word{font:52px Georgia;color:var(--n);margin:17px 0 4px}.phone{font-size:14px;color:var(--m)}.listen{border:0;border-radius:12px;padding:8px 12px;background:#edf3f7;color:var(--n);font-weight:700;margin-top:11px}.example{margin:19px 0;padding:13px;border-radius:15px;background:#f2f8f5;text-align:left;color:#476050;font:italic 14px/1.65 Georgia,serif}.example label{display:block;color:var(--g);font:700 11px -apple-system;margin-bottom:5px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons button{border:0;border-radius:16px;padding:15px;font-weight:800}.forget,.secondary{background:#fff0e8;color:#c85834}.remember,.primary{background:var(--g);color:#fff}.note{padding:14px;border-radius:16px;background:#fff4d8;color:#735b20;font-size:13px;line-height:1.65}.view{display:none}.view.active{display:block}.definition{margin-top:18px;padding:16px;border-radius:16px;background:#f2f8f5;line-height:1.8;font-size:14px;word-break:break-word}.definition b{font-size:18px;color:var(--g)}.field{padding:14px;border:1px solid #e8e4da;border-radius:15px;margin-bottom:12px}.field label{display:block;color:var(--m);font-size:13px;margin-bottom:8px}.field input{width:100%;padding:10px;border:1px solid #e8e4da;border-radius:10px;font-size:16px}.daily{display:flex;align-items:center;gap:10px}.daily input{width:86px;padding:9px;border:1px solid #e8e4da;border-radius:10px;text-align:center}.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.moods button{border:1px solid #e8e4da;background:#fff;border-radius:12px;padding:10px;color:var(--m)}.moods button.active{background:#fff0e8;border-color:var(--o);color:#b94d2d;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{padding:8px 1px;border:1px solid #e8e4da;border-radius:10px;text-align:center;font-size:11px;color:var(--m)}.day b{display:block;color:#202c36;font-size:15px;margin-top:3px}.day.done{background:#e9f5ef;border-color:#c7e4d6}.trophy{text-align:center}.cup{font-size:92px;border:0;background:none;filter:drop-shadow(0 10px 8px #d6a52655)}.trophy h1{color:var(--n);margin:5px 0}.trophy p{color:var(--m);line-height:1.7}.bottom{position:fixed;bottom:0;left:0;right:0;background:#f7f5efef;border-top:1px solid #e8e4da;display:flex;justify-content:center;gap:34px;padding:12px 20px calc(12px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:var(--m);font-size:12px}.nav.active{color:var(--n);font-weight:800}.nav span{display:block;font-size:20px}.toast{display:none;position:fixed;bottom:82px;left:50%;transform:translateX(-50%);padding:10px 14px;background:var(--n);color:#fff;border-radius:13px;font-size:13px}</style></head><body><main class="app"><header class="top"><div class="brand"><div><small>你好，亲爱的</small><b id="hello">忍者</b></div></div><span id="moodTop" class="mood">😊 愉快</span></header><section id="learn" class="view active"><div class="hero"><small>TODAY'S MISSION</small><h1>今天也要悄悄变强</h1><p>先回忆中文，再看词典例句与释义。</p><div class="track"><i id="bar"></i></div><div class="metrics"><div class="metric"><b id="progress">0 / 20</b><span>今日进度</span></div><div class="metric"><b id="rate">0%</b><span>今日记忆率</span></div></div></div><div class="head"><h2>选择词汇之路</h2><button class="link" onclick="show('settings')">设置</button></div><div class="levels"><button class="level active" data-l="basic" onclick="level(this)">🌱<b>启蒙基础</b><span>学前 · 小学</span></button><button class="level" data-l="exam" onclick="level(this)">🚀<b>考试进阶</b><span>考试 · 四六级</span></button><button class="level" data-l="pro" onclick="level(this)">🏆<b>高阶挑战</b><span>雅思 · 托福</span></button></div><div class="head"><h2>今日背诵</h2><span id="levelName" class="pill">启蒙基础</span></div><div class="card word-card"><span class="pill">第 <span id="num">1</span> / <span id="total">20</span> 个</span><div class="word" id="word"></div><div class="phone" id="phone"></div><button class="listen" onclick="speak()">🔊 听美式发音</button><div class="example"><label>COLLINS EXAMPLE</label><span id="example"></span></div><div class="buttons"><button class="forget" onclick="forget()">不记得</button><button class="remember" onclick="reveal()">记得</button></div></div><div class="head"><h2>艾宾浩斯复习提醒</h2></div><div class="note">✨ <b id="review">0</b> 个词建议复习；系统在第 1、2、4、7、15、30 天提醒你复盘。</div></section><section id="detail" class="view"><div class="head"><button class="link" onclick="show('learn')">‹ 返回单词</button><span class="pill">释义与用法</span></div><div class="card"><div id="dw" class="word" style="text-align:center"></div><div id="dp" class="phone" style="text-align:center"></div><div class="example"><label>COLLINS EXAMPLE</label><span id="de"></span></div><div class="definition"><b>中文释义</b><p id="dd"></p><b>词典用法</b><p id="du"></p></div><div class="buttons"><button class="secondary" onclick="show('learn')">再想一想</button><button class="primary" onclick="mastered()">掌握了，下一个</button></div></div></section><section id="trophy" class="view"><div class="card trophy"><button class="cup" onclick="show('calendar')">🏆</button><h1>打卡成功！</h1><p>今天的任务完成了。<br>点击奖杯查看打卡日历。</p><div class="buttons"><button class="secondary" onclick="show('calendar')">查看日历</button><button class="primary" onclick="show('learn')">明天再战</button></div></div></section><section id="calendar" class="view"><div class="head"><h2>打卡日历</h2><span class="pill">本月</span></div><div class="card"><div id="grid" class="calendar"></div><div class="note" style="margin-top:14px">本月已完成 <b id="days">0</b> 天打卡。</div></div></section><section id="settings" class="view"><div class="head"><h2>我的设置</h2></div><div class="card"><div class="field"><label>我的昵称</label><input id="nickname" maxlength="16" placeholder="例如：小忍者" onchange="setName(this.value)"></div><div class="field"><label>我的当日心情</label><div class="moods"><button data-m="happy" onclick="setMood('happy')">😊 愉快</button><button data-m="calm" onclick="setMood('calm')">😌 平静</button><button data-m="low" onclick="setMood('low')">😔 低落</button></div></div><div class="field daily"><label>每日打卡单词量<br><small>1–500 个</small></label><input id="daily" type="number" min="1" max="500" onchange="setDaily(this.value)"></div><div class="note">昵称和心情都只保存在本设备。低落时也没关系，完成一个单词就是进步。</div></div></section></main><nav class="bottom"><button class="nav active" data-v="learn" onclick="show('learn')"><span>🥷</span>背诵</button><button class="nav" data-v="calendar" onclick="show('calendar')"><span>🗓</span>日历</button><button class="nav" data-v="settings" onclick="show('settings')"><span>⚙️</span>设置</button></nav><div id="toast" class="toast"></div><script src="vocabulary-import.js"></script><script>const F={basic:[['apple','','','苹果','苹果','I want an apple.']],exam:[['analyze','','','分析','分析','We need to analyze the results.']],pro:[['sustainable','','','可持续的','可持续的','We need sustainable solutions.']]};const DB=window.WORD_NINJA_IMPORTED||F,LBL={basic:'启蒙基础',exam:'考试进阶',pro:'高阶挑战'},MOOD={happy:'😊 愉快',calm:'😌 平静',low:'😔 低落'},today=()=>new Date().toLocaleDateString('sv-SE');let s=JSON.parse(localStorage.getItem('ninja5')||'null')||{date:today(),daily:20,level:'basic',i:0,done:0,ok:0,streak:0,name:'忍者',mood:'happy',history:{},reviews:[]};if(s.date!==today()){s.date=today();s.done=0;s.ok=0;s.i=0}let ws=DB[s.level];function save(){localStorage.setItem('ninja5',JSON.stringify(s))}function cur(){return ws[s.i%ws.length]}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===(id==='detail'||id==='trophy'?'learn':id)));if(id==='calendar')cal();scrollTo(0,0)}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}function syncProfile(){hello.textContent=s.name||'忍者';nickname.value=s.name||'';moodTop.textContent=MOOD[s.mood];document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x.dataset.m===s.mood))}function draw(){let w=cur();word.textContent=w[0];phone.textContent=w[1]||'音标待补充';example.textContent=w[5]||w[2];num.textContent=Math.min(s.done+1,s.daily);total.textContent=s.daily;progress.textContent=s.done+' / '+s.daily;bar.style.width=Math.min(100,s.done/s.daily*100)+'%';rate.textContent=(s.done?Math.round(s.ok/s.done*100):0)+'%';review.textContent=s.reviews.filter(x=>x<=today()).length;syncProfile()}function level(e){document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));e.classList.add('active');s.level=e.dataset.l;ws=DB[s.level];s.i=0;levelName.textContent=LBL[s.level];save();draw()}function setName(x){s.name=x.trim()||'忍者';save();syncProfile();toast('昵称已保存')}function setMood(x){s.mood=x;save();syncProfile();toast('今日心情已记录')}function setDaily(x){s.daily=Math.max(1,Math.min(500,+x||20));save();draw();toast('每日目标已更新')}function forget(){s.i++;s.reviews.push(today());save();draw();toast('没关系，它会再次出现')}function reveal(){let w=cur();dw.textContent=w[0];dp.textContent=w[1]||'';de.textContent=w[5]||w[2];dd.textContent=w[3];du.textContent=w[4];show('detail')}function mastered(){s.done++;s.ok++;s.reviews.push(today());let complete=s.done>=s.daily;if(complete){s.history[today()]={words:s.done};s.streak++;toast('今日打卡成功！')}else{s.i++;toast('记忆成功，继续下一词')}save();if(complete)show('trophy');else{show('learn');draw()}draw()}function speak(){if(!('speechSynthesis'in window)){toast('浏览器不支持发音播放');return}let u=new SpeechSynthesisUtterance(cur()[0]);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function cal(){let e=grid,h=['日','一','二','三','四','五','六'],d=new Date(),y=d.getFullYear(),m=d.getMonth(),max=new Date(y,m+1,0).getDate(),pad=new Date(y,m,1).getDay();e.innerHTML=h.map(x=>'<div class="day" style="border:0;background:transparent;font-weight:700">'+x+'</div>').join('')+Array(pad).fill('<div></div>').join('');for(let n=1;n<=max;n++){let k=new Date(y,m,n).toLocaleDateString('sv-SE'),yes=!!s.history[k];e.innerHTML+='<div class="day '+(yes?'done':'')+'">'+(yes?'✓':'')+'<b>'+n+'</b></div>'}days.textContent=Object.keys(s.history).length}draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
